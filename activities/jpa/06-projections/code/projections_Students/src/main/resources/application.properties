spring.application.name=projections

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.defer-datasource-initialization=true

# Watch the SELECT list: a full entity read is 'select ...description..., name, price';
# a projection selects only the columns it needs.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

# Capture the SQL so the tests can assert which columns each read selects.
spring.jpa.properties.hibernate.session_factory.statement_inspector=cat.tecnocampus.projections.SqlInspector
