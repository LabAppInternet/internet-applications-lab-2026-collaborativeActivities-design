spring.application.name=queries

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.defer-datasource-initialization=true

# Watch the SQL each query style generates (derived, JPQL, native) — the habit from
# activity 01. Compare the where-clause, the join, and who wrote the SQL.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

# Let the fetch-join test count SQL statements.
spring.jpa.properties.hibernate.generate_statistics=true
