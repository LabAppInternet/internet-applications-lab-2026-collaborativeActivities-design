spring.application.name=nPlusOne

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.defer-datasource-initialization=true

# Watch the SQL Hibernate emits (the habit from activity 01). With an N+1 you will
# see one select for the parents followed by one more select per parent.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

# Let the code count SQL statements (used by PostDemoService and the tests).
spring.jpa.properties.hibernate.generate_statistics=true
